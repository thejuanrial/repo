{% extends "auctions/admin/admin_layout.html" %}
{% load static %}
{% block body %}

<div class="space-y-6 max-w-3xl mx-auto">
    <!-- Encabezado de Página -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-2 border-b border-neutral-200 dark:border-neutral-800">
        <div>
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-neutral-900 dark:text-white">Crear Nuevo Usuario</h1>
            <p class="text-xs sm:text-sm text-neutral-500 dark:text-neutral-400 mt-1">Registre manualmente un nuevo usuario en la base de datos</p>
        </div>
        <a href="{% url 'manage_users' %}" class="inline-flex items-center gap-1.5 text-xs sm:text-sm text-neutral-600 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-white transition">
            &larr; Volver a Usuarios
        </a>
    </div>

    {% if error %}
    <div class="p-4 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-xs sm:text-sm">
        {{ error }}
    </div>
    {% endif %}

    <!-- Tarjeta del Formulario -->
    <div class="bg-white dark:bg-[#0f141e] border border-neutral-200 dark:border-neutral-800 rounded-2xl p-4 sm:p-6 md:p-8 shadow-xs">
        <form method="post" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1.5">Nombre de Usuario *</label>
                    <input type="text" name="username" value="{{ form_data.username|default:'' }}" required placeholder="Ej: carmen_sanchez" class="w-full px-3 py-2 rounded-xl text-xs sm:text-sm bg-neutral-50 dark:bg-neutral-800/80 border border-neutral-200 dark:border-neutral-700 text-neutral-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1.5">Contraseña Inicial *</label>
                    <input type="password" name="password" required placeholder="Mínimo 4 caracteres" class="w-full px-3 py-2 rounded-xl text-xs sm:text-sm bg-neutral-50 dark:bg-neutral-800/80 border border-neutral-200 dark:border-neutral-700 text-neutral-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1.5">Nombre</label>
                    <input type="text" name="first_name" value="{{ form_data.first_name|default:'' }}" placeholder="Nombre" class="w-full px-3 py-2 rounded-xl text-xs sm:text-sm bg-neutral-50 dark:bg-neutral-800/80 border border-neutral-200 dark:border-neutral-700 text-neutral-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1.5">Apellido</label>
                    <input type="text" name="last_name" value="{{ form_data.last_name|default:'' }}" placeholder="Apellido" class="w-full px-3 py-2 rounded-xl text-xs sm:text-sm bg-neutral-50 dark:bg-neutral-800/80 border border-neutral-200 dark:border-neutral-700 text-neutral-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1.5">Correo Electrónico</label>
                    <input type="email" name="email" value="{{ form_data.email|default:'' }}" placeholder="usuario@correo.com" class="w-full px-3 py-2 rounded-xl text-xs sm:text-sm bg-neutral-50 dark:bg-neutral-800/80 border border-neutral-200 dark:border-neutral-700 text-neutral-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1.5">Dirección</label>
                    <input type="text" name="address" value="{{ form_data.address|default:'' }}" placeholder="Ciudad, Dirección" class="w-full px-3 py-2 rounded-xl text-xs sm:text-sm bg-neutral-50 dark:bg-neutral-800/80 border border-neutral-200 dark:border-neutral-700 text-neutral-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1.5">Foto de Perfil (Opcional)</label>
                <input type="file" name="profile_picture" accept="image/*" class="w-full px-3 py-2 rounded-xl text-xs bg-neutral-50 dark:bg-neutral-800/80 border border-neutral-200 dark:border-neutral-700 text-neutral-600 dark:text-neutral-300 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-neutral-900 file:text-white dark:file:bg-white dark:file:text-neutral-900 hover:file:opacity-90">
            </div>

            <div class="pt-3">
                <span class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-2">Permisos y Estado de la Cuenta</span>
                <div class="flex flex-col sm:flex-row flex-wrap gap-4 p-4 rounded-xl bg-neutral-50 dark:bg-neutral-800/40 border border-neutral-200 dark:border-neutral-700">
                    <label class="flex items-center gap-2 cursor-pointer text-xs sm:text-sm text-neutral-800 dark:text-neutral-200">
                        <input type="checkbox" name="is_active" checked class="rounded text-blue-600 focus:ring-blue-500">
                        <span>Cuenta Activa</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer text-xs sm:text-sm text-neutral-800 dark:text-neutral-200">
                        <input type="checkbox" name="is_staff" class="rounded text-blue-600 focus:ring-blue-500">
                        <span>Acceso Staff</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer text-xs sm:text-sm text-neutral-800 dark:text-neutral-200">
                        <input type="checkbox" name="is_superuser" class="rounded text-blue-600 focus:ring-blue-500">
                        <span>Superadministrador</span>
                    </label>
                </div>
            </div>

            <!-- Botones Responsivos -->
            <div class="pt-5 border-t border-neutral-200 dark:border-neutral-800 flex flex-col sm:flex-row gap-3">
                <button type="submit" class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 text-white transition shadow-sm">
                    Crear Usuario
                </button>
                <a href="{% url 'manage_users' %}" class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-2.5 rounded-xl text-xs sm:text-sm font-medium border border-neutral-300 dark:border-neutral-700 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-50 dark:hover:bg-neutral-800 transition">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
