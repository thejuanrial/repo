{% extends "auctions/admin/admin_layout.html" %}
{% block body %}

<div class="space-y-6 max-w-2xl mx-auto">
    <!-- Encabezado de Página -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-2 border-b border-neutral-200 dark:border-neutral-800">
        <div>
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-neutral-900 dark:text-white">Editar Categoría</h1>
            <p class="text-xs sm:text-sm text-neutral-500 dark:text-neutral-400 mt-1">Modificando la categoría: <span class="font-semibold text-neutral-800 dark:text-neutral-200">{{ category.name }}</span></p>
        </div>
        <a href="{% url 'manage_categories' %}" class="inline-flex items-center gap-1.5 text-xs sm:text-sm text-neutral-600 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-white transition">
            &larr; Volver a Categorías
        </a>
    </div>

    <!-- Tarjeta del Formulario -->
    <div class="bg-white dark:bg-[#0f141e] border border-neutral-200 dark:border-neutral-800 rounded-2xl p-4 sm:p-6 md:p-8 shadow-xs">
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1.5">Nombre de la Categoría *</label>
                <input type="text" name="name" value="{{ category.name }}" required class="w-full px-3 py-2 rounded-xl text-xs sm:text-sm bg-neutral-50 dark:bg-neutral-800/80 border border-neutral-200 dark:border-neutral-700 text-neutral-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1.5">Descripción</label>
                <textarea name="description" rows="3" class="w-full px-3 py-2 rounded-xl text-xs sm:text-sm bg-neutral-50 dark:bg-neutral-800/80 border border-neutral-200 dark:border-neutral-700 text-neutral-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">{{ category.description }}</textarea>
            </div>

            <div class="pt-2">
                <label class="inline-flex items-center gap-2 cursor-pointer text-xs sm:text-sm text-neutral-800 dark:text-neutral-200">
                    <input type="checkbox" name="is_active" {% if category.is_active %}checked{% endif %} class="rounded text-blue-600 focus:ring-blue-500">
                    <span>Categoría Activa en Filtros</span>
                </label>
            </div>

            <!-- Botones Responsivos -->
            <div class="pt-5 border-t border-neutral-200 dark:border-neutral-800 flex flex-col sm:flex-row gap-3">
                <button type="submit" class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white transition shadow-sm">
                    Guardar Cambios
                </button>
                <a href="{% url 'manage_categories' %}" class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-2.5 rounded-xl text-xs sm:text-sm font-medium border border-neutral-300 dark:border-neutral-700 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-50 dark:hover:bg-neutral-800 transition">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
