
{% extends 'auctions/layout.html' %}

{% block body %}
    <div class="flex justify-center items-center w-full h-screen bg-gray-900">
        <div class="bg-white p-8 rounded-md shadow-md text-center">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Cuenta Verificada!</h2>
            <p class="text-gray-800 mb-4">Tu cuenta ha sido creada exitosamente.</p>
            <p class="text-gray-600 mb-4">Seras redirigido a la pagina de inicio de sesion en <span id="countdown">5</span> segundos...</p>
            <a href="{% url 'login' %}" class="text-blue-500 hover:underline">Haz clic aqui si no eres redirigido</a>
        </div>
    </div>

    <script>
        let seconds = 5;
        const countdownEl = document.getElementById('countdown');
        const interval = setInterval(function() {
            seconds--;
            countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = "{% url 'login' %}";
            }
        }, 1000);
    </script>
{% endblock %}
