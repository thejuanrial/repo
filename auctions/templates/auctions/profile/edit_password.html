{% extends "auctions/layout.html" %}
{% load static %}
{% block body %}
<section class="dark:bg-gray-900 w-[100vw] min-h-[100vh] pt-[10vh]">
    <div class="container mx-auto py-8 px-4 max-w-xl">
        <h1 class="text-gray-300 text-2xl font-bold mb-4">Modificar Contraseña</h1>
        <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
            <form method="post">
                {% csrf_token %}
                {% if error %}
                <p class="text-red-500 mb-4">{{ error }}</p>
                {% endif %}
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="original_password">Contraseña Actual</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="original_password" type="password" placeholder="Contraseña Actual" name="original_password" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="new_password">Nueva Contraseña</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="new_password" type="password" placeholder="Nueva Contraseña" name="new_password" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="confirm_password">Confirmar Nueva Contraseña</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="confirm_password" type="password" placeholder="Confirmar Nueva Contraseña" name="confirm_password" required>
                </div>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Guardar Cambios</button>
            </form>
            <div class="flex justify-end mt-4">
                <a href="{% url 'forgot_password' %}" class="text-gray-600 text-sm font-medium hover:text-blue-500">¿Olvidó su contraseña?</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
